services:
  ai-service:
    build:
      context: ./services/ai-service
    container_name: smartlive-ai-service
    ports:
      - "8001:8001"

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: smartlive-api-gateway
    environment:
      AI_SERVICE_URL: http://ai-service:8001
    depends_on:
      - ai-service
    ports:
      - "8000:8000"
