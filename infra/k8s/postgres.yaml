apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: smartlive
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - {name: POSTGRES_DB, value: smartlive}
            - {name: POSTGRES_USER, value: smartlive}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartlive-secret
                  key: POSTGRES_PASSWORD
          ports:
            - {containerPort: 5432}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: smartlive
spec:
  selector: {app: postgres}
  ports:
    - {port: 5432, targetPort: 5432}
