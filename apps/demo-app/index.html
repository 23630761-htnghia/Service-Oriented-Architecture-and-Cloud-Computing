<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartLive Chatbot Livestream</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="live-area">
      <header class="topbar">
        <div>
          <p class="eyebrow">SmartLive Demo</p>
          <h1>Livestream bán hàng với chatbot tự động</h1>
        </div>
        <div class="live-status">
          <span id="live-dot" class="live-dot"></span>
          <strong id="live-label">Đang live</strong>
          <span id="viewer-count">1.284 người xem</span>
        </div>
      </header>

      <section class="live-stage">
        <img
          src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1400&q=80"
          alt="Livestream studio"
        />
        <div class="stage-overlay">
          <span>Flash sale 21:00</span>
          <strong id="featured-product-name">Serum Vitamin C LumiSkin</strong>
          <p id="featured-product-price">Giá live 129.000 đ</p>
        </div>
      </section>

      <section class="product-strip">
        <div class="section-title">
          <p class="eyebrow">Sản phẩm trong live</p>
          <h2>Sản phẩm đang bán</h2>
        </div>
        <div id="product-list" class="product-list"></div>
      </section>
    </section>

    <aside class="chat-panel">
      <header class="chat-head">
        <div>
          <p class="eyebrow">Chatbot AI</p>
          <h2>Tư vấn khách hàng</h2>
        </div>
        <button id="reset-chat-btn" type="button" class="ghost-btn">Làm mới</button>
      </header>

      <div class="context-bar">
        <span>Đang tư vấn:</span>
        <strong id="context-product">Serum Vitamin C LumiSkin</strong>
      </div>

      <div id="quick-actions" class="quick-actions"></div>
      <section id="message-list" class="message-list" aria-live="polite"></section>

      <form id="chat-form" class="chat-form">
        <label for="chat-input">Tin nhắn khách hàng</label>
        <div class="chat-input-row">
          <input id="chat-input" type="text" autocomplete="off" placeholder="Nhập tin nhắn của khách..." />
          <button type="submit" class="primary-btn">Gửi</button>
        </div>
      </form>
    </aside>
  </main>

  <script src="./app.js"></script>
</body>
</html>
