services:
  ai-service:
    build:
      context: ../../backend/services/ai-service
    container_name: smartlive-ai-service
    ports:
      - "8001:8001"

  api-gateway:
    build:
      context: ../../backend/services/api-gateway
    container_name: smartlive-api-gateway
    environment:
      AI_SERVICE_URL: http://ai-service:8001
    depends_on:
      - ai-service
    ports:
      - "8000:8000"

  demo-app:
    build:
      context: ../../apps/demo-app
    container_name: smartlive-chatbot-app
    depends_on:
      - api-gateway
    ports:
      - "3010:3010"
