apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: smartlive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: smartlive/auth-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: smartlive-secret
          ports:
            - containerPort: 8010
          readinessProbe: {httpGet: {path: /ready, port: 8010}}
          livenessProbe: {httpGet: {path: /health, port: 8010}}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: smartlive
spec:
  selector: {app: auth-service}
  ports:
    - port: 8010
      targetPort: 8010
---
