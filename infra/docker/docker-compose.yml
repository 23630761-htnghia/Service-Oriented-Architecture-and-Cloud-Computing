services:
  ai-service:
    build:
      context: ../../backend/services/ai-service
    container_name: ai-service
    ports:
      - "8001:8001"

  auth-service:
    build:
      context: ../../backend/services/auth-service
    container_name: auth-service
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8003
    depends_on:
      - account-service
    ports:
      - "8002:8002"

  account-service:
    build:
      context: ../../backend/services/account-service
    container_name: account-service
    volumes:
      - ../../backend/services/account-service/app/data:/app/app/data
    ports:
      - "8003:8003"

  sync-service:
    build:
      context: ../../backend/services/sync-service
    container_name: sync-service
    ports:
      - "8004:8004"

  report-service:
    build:
      context: ../../backend/services/report-service
    container_name: report-service
    ports:
      - "8005:8005"

  api-gateway:
    build:
      context: ../../backend/services/api-gateway
    container_name: api-gateway
    environment:
      AI_SERVICE_URL: http://ai-service:8001
      AUTH_SERVICE_URL: http://auth-service:8002
      ACCOUNT_SERVICE_URL: http://account-service:8003
      SYNC_SERVICE_URL: http://sync-service:8004
      REPORT_SERVICE_URL: http://report-service:8005
    depends_on:
      - ai-service
      - auth-service
      - account-service
      - sync-service
      - report-service
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../../frontend
    container_name: livestream-frontend
    depends_on:
      - api-gateway
    ports:
      - "3000:3000"
