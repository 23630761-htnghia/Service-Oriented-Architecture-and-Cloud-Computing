apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smartlive
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: smartlive/api-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: smartlive-config
            - secretRef:
                name: smartlive-secret
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: smartlive
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000
---
