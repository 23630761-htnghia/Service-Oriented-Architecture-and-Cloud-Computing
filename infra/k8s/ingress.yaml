apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartlive-ingress
  namespace: smartlive
spec:
  rules:
    - host: smartlive.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3010
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
