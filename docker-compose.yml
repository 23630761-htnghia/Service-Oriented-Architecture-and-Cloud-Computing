services:
  kafka:
    image: apache/kafka:4.3.0
    container_name: smartlive-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-init:
    image: apache/kafka:4.3.0
    container_name: smartlive-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -lc '
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic customer.message.created --partitions 1 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ai.reply.generated --partitions 1 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ai.reply.failed --partitions 1 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic seller.manual.reply.created --partitions 1 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order.created --partitions 1 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic product.stock.updated --partitions 1 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic livestream.started --partitions 1 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic livestream.ended --partitions 1 --replication-factor 1;
      '

  redis:
    image: redis:7-alpine
    container_name: smartlive-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: smartlive-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smartlive
      MINIO_ROOT_PASSWORD: smartlive123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: smartlive-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartlive-postgres
    environment:
      POSTGRES_DB: smartlive
      POSTGRES_USER: smartlive
      POSTGRES_PASSWORD: smartlive
    ports:
      - "5432:5432"
    volumes:
      - smartlive-postgres-data:/var/lib/postgresql/data
      - ./infra/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlive -d smartlive"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./backend/services/auth-service
    container_name: smartlive-auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  user-service:
    build: ./backend/services/user-service
    container_name: smartlive-user-service
    ports:
      - "8011:8011"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8011/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  shop-service:
    build: ./backend/services/shop-service
    container_name: smartlive-shop-service
    ports:
      - "8012:8012"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8012/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  product-service:
    build: ./backend/services/product-service
    container_name: smartlive-product-service
    ports:
      - "8013:8013"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8013/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  voucher-service:
    build: ./backend/services/voucher-service
    container_name: smartlive-voucher-service
    ports:
      - "8014:8014"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8014/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  livestream-service:
    build: ./backend/services/livestream-service
    container_name: smartlive-livestream-service
    ports:
      - "8015:8015"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8015/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  chat-service:
    build: ./backend/services/chat-service
    container_name: smartlive-chat-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8016:8016"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8016/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-assistant-service:
    build: ./backend/services/ai-service
    container_name: smartlive-ai-assistant-service
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-3}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-220}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql://smartlive:smartlive@postgres:5432/smartlive
    depends_on:
      ollama:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service:
    build: ./backend/services/order-service
    container_name: smartlive-order-service
    ports:
      - "8017:8017"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8017/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  notification-service:
    build: ./backend/services/notification-service
    container_name: smartlive-notification-service
    ports:
      - "8018:8018"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8018/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  analytics-service:
    build: ./backend/services/analytics-service
    container_name: smartlive-analytics-service
    ports:
      - "8019:8019"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8019/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build: ./backend/services/api-gateway
    container_name: smartlive-api-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:8010
      USER_SERVICE_URL: http://user-service:8011
      SHOP_SERVICE_URL: http://shop-service:8012
      PRODUCT_SERVICE_URL: http://product-service:8013
      VOUCHER_SERVICE_URL: http://voucher-service:8014
      LIVESTREAM_SERVICE_URL: http://livestream-service:8015
      CHAT_SERVICE_URL: http://chat-service:8016
      AI_SERVICE_URL: http://ai-assistant-service:8001
      ORDER_SERVICE_URL: http://order-service:8017
      NOTIFICATION_SERVICE_URL: http://notification-service:8018
      ANALYTICS_SERVICE_URL: http://analytics-service:8019
      DATABASE_URL: postgresql://smartlive:smartlive@postgres:5432/smartlive
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: 120
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      livestream-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      ai-assistant-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend-app:
    build: ./apps/frontend-app
    container_name: smartlive-frontend-app
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3010:3010"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3010', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: smartlive-prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: smartlive-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  smartlive-postgres-data:
  ollama_data:
  minio_data:
  grafana_data:
